[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchenlab"
version = "0.1.0"
description = "Case store, culinary catalog, and experiment simulator for KitchenLab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kitchenlab = ["data/catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
