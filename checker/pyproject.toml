[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breachmirror"
version = "0.1.0"
description = "Case store and read-only checks for BreachMirror"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
breachmirror = ["data/atlas.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
