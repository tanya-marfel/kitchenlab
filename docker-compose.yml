services:
  checker:
    build:
      context: .
      dockerfile: checker/Dockerfile
    env_file: .env
    environment:
      CASE_DIR: /data/cases
      DEMO_ROOT: /demo-target
      BREACHMIRROR_ROOT: /srv
    volumes:
      - cases:/data/cases
    ports:
      - "8000:8000"

  n8n:
    image: n8nio/n8n:1.109.0
    env_file: .env
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-breachmirror-local-dev-key}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      EXECUTIONS_TIMEOUT: "600"
      EXECUTIONS_TIMEOUT_MAX: "900"
      NEBIUS_MODEL: ${NEBIUS_MODEL}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - checker

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - checker
      - n8n

volumes:
  cases:
  n8n_data:
